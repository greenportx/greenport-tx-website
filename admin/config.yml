# Use DecapBridge classic auth (required)
backend:
  name: git-gateway
  repo: greenportx/greenport-tx-website
  branch: main
  identity_url: https://auth.decapbridge.com/sites/94e27c15-248d-4efd-825d-4a7fd54b2b71
  gateway_url: https://gateway.decapbridge.com
  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge
# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg
# Add site links in Decap CMS (optional)
site_url: https://enchanting-strudel-452039.netlify.app

media_folder: "content/images"
public_folder: "/content/images"

locale: "es"

collections:
  - name: "products"
    label: "Productos"
    label_singular: "Producto"
    files:
      - name: "catalogo"
        label: "Catálogo Completo"
        file: "content/products.json"
        fields:
          - label: "Categorías"
            name: "categories"
            widget: "list"
            fields:
              - { label: "Clave (no cambiar)", name: "key", widget: "string" }
              - { label: "Nombre en Español", name: "es", widget: "string" }
              - { label: "Nombre en Inglés", name: "en", widget: "string" }

          - label: "Foto de respaldo por categoría"
            name: "category_photos"
            widget: "object"
            fields:
              - { label: "Inseminación Artificial (ia)", name: "ia", widget: "image", required: false }
              - { label: "Transferencia de Embriones (te)", name: "te", widget: "image", required: false }
              - { label: "Identificación Animal (id)", name: "id", widget: "image", required: false }
              - { label: "Guantes y Protección (gp)", name: "gp", widget: "image", required: false }
              - { label: "Cuidado Bovino (cb)", name: "cb", widget: "image", required: false }
              - { label: "Cercas Eléctricas (ce)", name: "ce", widget: "image", required: false }

          - label: "Productos"
            name: "products"
            widget: "list"
            summary: "{{fields.sku}} — {{fields.name_es}}"
            fields:
              - { label: "SKU", name: "sku", widget: "string" }
              - label: "Categoría"
                name: "category"
                widget: "select"
                options:
                  - { label: "Inseminación Artificial", value: "ia" }
                  - { label: "Transferencia de Embriones", value: "te" }
                  - { label: "Identificación Animal", value: "id" }
                  - { label: "Guantes y Protección", value: "gp" }
                  - { label: "Cuidado Bovino", value: "cb" }
                  - { label: "Cercas Eléctricas", value: "ce" }
              - { label: "Nombre (Español)", name: "name_es", widget: "string" }
              - { label: "Nombre (Inglés)", name: "name_en", widget: "string" }
              - { label: "Descripción (Español)", name: "description_es", widget: "text" }
              - { label: "Descripción (Inglés)", name: "description_en", widget: "text" }
              - { label: "Texto alternativo de la foto (SEO)", name: "alt", widget: "string" }
              - { label: "Foto del producto", name: "image", widget: "image", required: false, hint: "Recomendado 1200x600px" }

  - name: "site_content"
    label: "Textos del Sitio"
    label_singular: "Sección"
    files:
      - name: "general"
        label: "Información General"
        file: "content/site.json"
        fields:
          - label: "Hero Principal"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Título (Español)", name: "title_es", widget: "string" }
              - { label: "Título (Inglés)", name: "title_en", widget: "string" }
              - { label: "Subtítulo (Español)", name: "subtitle_es", widget: "text" }
              - { label: "Subtítulo (Inglés)", name: "subtitle_en", widget: "text" }
              - { label: "Foto de fondo", name: "photo", widget: "image", required: false }

          - label: "Nosotros"
            name: "about"
            widget: "object"
            fields:
              - { label: "Párrafo 1 (Español)", name: "p1_es", widget: "text" }
              - { label: "Párrafo 1 (Inglés)", name: "p1_en", widget: "text" }
              - { label: "Párrafo 2 (Español)", name: "p2_es", widget: "text" }
              - { label: "Párrafo 2 (Inglés)", name: "p2_en", widget: "text" }
              - { label: "Foto", name: "photo", widget: "image", required: false }

          - label: "Contacto"
            name: "contact"
            widget: "object"
            fields:
              - { label: "WhatsApp / Teléfono", name: "phone", widget: "string" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Instagram", name: "instagram", widget: "string" }
